<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="ミニシアターの上映予定。日付と映画館から、次に観たい一本を探す。">
  <title>上映手帖 — ミニシアターの上映予定</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#results">上映一覧へ</a>
  <header class="masthead">
    <div class="eyebrow">MINI THEATER / SCREENING NOTES</div>
    <h1>上映手帖<span aria-hidden="true">.</span></h1>
    <p class="intro">次に観る一本を、見つける。</p>
    <p id="updated" class="muted"></p>
  </header>
  <main>
    <section class="filters" aria-label="上映予定の絞り込み">
      <label>日付<select id="date-filter" disabled><option value="">すべての日付</option></select></label>
      <label>映画館<select id="theater-filter" disabled><option value="">すべての映画館</option></select></label>
      <label class="search">作品名で探す<input id="search" type="search" placeholder="タイトルを入力" disabled></label>
      <button id="reset" type="button" disabled>条件をクリア</button>
    </section>
    <div class="results-heading"><h2 id="results" tabindex="-1">上映作品</h2><p id="count" role="status" aria-live="polite">読み込み中…</p></div>
    <p id="status" role="status"></p>
    <div id="cards" class="cards"></div>
    <noscript><p>上映一覧の表示にはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <footer>
    <p>上映時刻・内容は変更になる場合があります。お出かけ前に映画館の公式情報をご確認ください。</p>
    <p>作品情報・画像：<a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a>、各映画館公式サイト、Wikipedia。</p>
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>
  <dialog id="movie-dialog" aria-labelledby="detail-title">
    <div class="dialog-toolbar"><button id="close-detail" type="button" autofocus>閉じる ×</button></div>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
